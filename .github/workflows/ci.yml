name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --locked: fail if uv.lock is out of date instead of silently resolving
      # newer (possibly breaking) dependency versions.
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check sac_mcp tests
      - name: Type check
        run: uv run mypy sac_mcp
      - name: Unit tests
        run: uv run pytest tests/unit -q
