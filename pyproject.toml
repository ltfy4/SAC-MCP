[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sac-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing the full SAP Analytics Cloud public API surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SAC-MCP contributors" }]
keywords = ["mcp", "sap", "analytics-cloud", "sac", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "anyio>=4.3",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-python-dateutil",
]

[project.scripts]
sac-mcp = "sac_mcp.__main__:main"
sac-mcp-setup = "sac_mcp.setup_cli:main"

[project.urls]
Homepage = "https://github.com/ltfy4/sac-mcp"
Issues = "https://github.com/ltfy4/sac-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["sac_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# FastMCP's @server.tool() / @server.resource() / @server.prompt() decorators
# have no type stubs. Relax the two strict checks that cascade from that gap.
module = ["sac_mcp.tools.*", "sac_mcp.resources.*", "sac_mcp.prompts.*"]
disallow_untyped_decorators = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: integration tests that hit a real SAC tenant (requires SAC_LIVE_TEST=1)",
]
